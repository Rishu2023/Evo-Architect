# ============================================================
# Evo-Architect Global Configuration
# All hyperparameters are defined here so Agent 1 can mutate
# this file to propose new architectural variants.
# ============================================================

model:
  # Embedding / hidden dimension.  Must be divisible by 8.
  d_model: 192

  # Number of stacked CDLE blocks
  n_layers: 4

  # SSM state dimension (controls memory capacity of each layer)
  d_state: 16

  # Number of fractal SSM hierarchy levels
  fractal_levels: 2

  # Intermediate expansion factor inside each CDLE block
  d_ff: 256

  # Vocabulary size: 256 for raw bytes (0–255)
  vocab_size: 256

  # Context window length in tokens (bytes)
  seq_len: 256

  # Liquid Time-Constant base tau value
  ltc_tau_base: 1.0

  # Complexity gate threshold for sparse liquid routing
  complexity_gate_threshold: 0.5

  # Forward-Forward goodness threshold
  ff_threshold: 2.0

  # FF variant: "distance" (Distance-FF) or "contrastive" (Self-Contrastive)
  ff_variant: "distance"

  # Dropout probability (0 = off for speed)
  dropout: 0.0

  # Maximum parameter count (hard cap for all models)
  max_params: 12000000

training:
  # Mini-batch size. Keep small for CPU memory.
  batch_size: 32

  # Maximum optimiser steps. 500 steps × ~0.5 s/step ≈ 4 min on CPU.
  max_steps: 500

  # Validation interval (every N steps)
  val_every: 100

  # Number of validation batches
  val_steps: 20

  # AdamW learning rate
  learning_rate: 3.0e-4

  # Weight decay for regularisation
  weight_decay: 1.0e-2

  # Gradient clipping max norm
  grad_clip: 1.0

  # Warmup steps for linear LR schedule
  warmup_steps: 50

data:
  # Hugging Face dataset name
  dataset_name: "roneneldan/TinyStories"

  # Number of training samples to use (keep low for speed)
  num_train_samples: 9000

  # Number of validation samples
  num_val_samples: 1000

  # Local cache path for prepared data
  cache_path: "data/tinystories_cache.pt"

  # Multi-task eval datasets (1k samples each)
  multi_task:
    piqa_samples: 1000
    gsm8k_samples: 1000
    arc_samples: 1000

evolution:
  # Path to the evolutionary memory JSON file
  memory_path: "evolutionary_memory.json"

  # Path to the latest benchmark results
  results_path: "benchmark_results.json"

  # Improvement threshold: new model must beat best by at least this fraction
  improvement_threshold: 0.01

  # Maximum history entries to keep in memory (oldest are pruned)
  max_history: 20

  # QD archive settings (MAP-Elites style)
  qd_archive_path: "archive/qd_population.json"
  qd_max_species: 12
  qd_complexity_bins: 4
  qd_sparsity_bins: 3

curriculum:
  # Curriculum evolution settings
  initial_difficulty: 0.3
  max_difficulty: 1.0
  difficulty_step: 0.1
  curriculum_path: "archive/curriculum_state.json"

energy:
  # Energy proxy estimation settings
  cpu_tdp_watts: 65.0
  flops_weight: 0.5
  watt_weight: 0.5
